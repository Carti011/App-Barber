services:
  postgres:
    image: postgres:16-alpine
    container_name: app-barber-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: barber_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
